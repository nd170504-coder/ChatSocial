spring:
  datasource:
    url: jdbc:h2:mem:auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS chatsocial
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
app:
  brevo:
    api-key: test-key-not-a-real-key
    sender-email: no-reply@chatsocial.test
    sender-name: ChatSocial Test
  email-verification:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    ttl-seconds: 300
    resend-cooldown-seconds: 60
    max-attempts: 5
    max-sends-per-hour: 5
  jwt:
    # Public fixture for isolated tests only. Never use in a running deployment.
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    issuer: chatsocial-test
    access-token-seconds: 10800
  cors:
    allowed-origins: http://localhost:5173
  supabase:
    url: https://storage.example
    secret-key: test-secret-not-a-real-key
    bucket: profile-images
