spring:
  application:
    name: chatsocial
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: chatsocial
        format_sql: true

server:
  port: 8080

app:
  mail:
    from: ${MAIL_FROM:${spring.mail.username:}}
  email-verification:
    secret: ${EMAIL_OTP_SECRET:${JWT_SECRET}}
    ttl-seconds: ${EMAIL_OTP_TTL_SECONDS:300}
    resend-cooldown-seconds: ${EMAIL_OTP_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${EMAIL_OTP_MAX_ATTEMPTS:5}
    max-sends-per-hour: ${EMAIL_OTP_MAX_SENDS_PER_HOUR:5}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:chatsocial}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:10800}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:604800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:none}
  supabase:
    url: ${SUPABASE_URL:none}
    secret-key: ${SUPABASE_SECRET_KEY:none}
    bucket: ${SUPABASE_STORAGE_BUCKET:profile-images}
    post-bucket: ${SUPABASE_POST_BUCKET:post-images}
