spring:
  application:
    name: chatsocial

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: chatsocial
        format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:chatsocial}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:10800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:none}
  supabase:
    url: ${SUPABASE_URL:none}
    secret-key: ${SUPABASE_SECRET_KEY:none}
    bucket: ${SUPABASE_STORAGE_BUCKET:profile-images}
